<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading... — Learning Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

.loader-wrapper {
    text-align: center;
    color: white;
    animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.spinner {
    width: 60px;
    height: 60px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px auto;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loader-wrapper h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 8px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
}

.loader-wrapper p {
    font-size: 14px;
    opacity: 0.85;
}

.brand-icon {
    font-size: 48px;
    margin-bottom: 16px;
    display: inline-block;
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}
</style>
</head>
<body>

<div class="loader-wrapper">
    <div class="brand-icon">📚</div>
    <div class="spinner"></div>
    <h1>Learning Dashboard</h1>
    <p id="statusText">กำลังตรวจสอบสถานะ...</p>
</div>

<script>
// ============================================================
// Supabase Config
// ============================================================
const SUPABASE_URL = 'https://chatznbacqeyjaaakeyy.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoYXR6bmJhY3FleWphYWFrZXl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMzM0OTQsImV4cCI6MjEwMDgwOTQ5NH0.QKbLgmkkv60UXd7YULCyNrYqiRAzzSNbqJ0mQ6n9GKk';

const statusText = document.getElementById('statusText');

(async function checkSession() {
    try {
        const sb = window.supabase;
        if (!sb || !sb.createClient) {
            statusText.textContent = 'กำลังโหลดระบบ...';
            setTimeout(() => checkSession(), 500);
            return;
        }

        const supabaseClient = sb.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        });

        const { data: { session } } = await supabaseClient.auth.getSession();

        if (session?.user) {
            statusText.textContent = 'เข้าสู่ระบบแล้ว กำลังไปหน้าหลัก...';
            setTimeout(() => {
                window.location.href = 'learning_dashboard.html';
            }, 400);
        } else {
            statusText.textContent = 'กรุณาเข้าสู่ระบบ...';
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 400);
        }
    } catch (err) {
        statusText.textContent = 'เกิดข้อผิดพลาด กำลังไปหน้าเข้าสู่ระบบ...';
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 1000);
    }
})();
</script>

</body>
</html>
